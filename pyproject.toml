[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-aibot-ws"
version = "0.1.0"
description = "Zero-dependency Python SDK for WeCom (Enterprise WeChat) AI Bot WebSocket long-connection & serverless push"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tianou10086-create"}]
keywords = ["wecom", "wechat-work", "enterprise-wechat", "aibot", "websocket", "bot", "zero-dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tianou10086-create/wecom-aibot-ws"
Repository = "https://github.com/tianou10086-create/wecom-aibot-ws"
